<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mender</title>
<style>
  :root { color-scheme: light dark; --muted: #6b7280; --line: #e5e7eb; }
  @media (prefers-color-scheme: dark) { :root { --line: #2d333b; --muted: #9ca3af; } }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 2rem auto; max-width: 1100px; padding: 0 1rem; }
  h1 { margin: 0 0 .25rem; } p.sub { color: var(--muted); margin: 0 0 1.5rem; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: .75rem; margin-bottom: 1.5rem; }
  .tile { border: 1px solid var(--line); border-radius: 8px; padding: .75rem 1rem; }
  .tile b { display: block; font-size: 1.5rem; } .tile span { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  code { font-size: 12px; }
</style>
</head>
<body>
<h1>🩺 Mender</h1>
<p class="sub">Recent CI failure diagnoses</p>
<div class="tiles" id="tiles"></div>
<table>
  <thead><tr><th>When</th><th>PR</th><th>Job</th><th>Category</th><th>Summary</th><th>Patch</th><th>Cost</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

async function load() {
  const [stats, rows] = await Promise.all([
    fetch("/api/stats").then(r => r.json()),
    fetch("/api/diagnoses").then(r => r.json()),
  ]);
  const valid = stats.patches.valid || 0;
  const drafted = valid + (stats.patches.invalid || 0);
  const tiles = [
    ["Diagnoses", stats.diagnoses],
    ["Answered without a model call", stats.skipped_llm],
    ["Patches that applied", drafted ? `${valid}/${drafted}` : "–"],
    ["Avg cost per model call", stats.avg_cost_usd != null ? `$${stats.avg_cost_usd.toFixed(3)}` : "–"],
    ["Avg model latency", stats.avg_llm_latency_ms != null ? `${(stats.avg_llm_latency_ms / 1000).toFixed(1)}s` : "–"],
  ];
  document.getElementById("tiles").innerHTML = tiles
    .map(([k, v]) => `<div class="tile"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join("");
  document.getElementById("rows").innerHTML = rows.map(d => `<tr>
    <td>${esc(new Date(d.created_at).toLocaleString())}</td>
    <td><a href="https://github.com/${esc(d.repo)}/pull/${esc(d.pr_number)}">${esc(d.repo)}#${esc(d.pr_number)}</a></td>
    <td><code>${esc(d.job)}</code></td>
    <td>${esc(d.category)}</td>
    <td>${esc(d.summary)}</td>
    <td>${esc(d.patch_status)}</td>
    <td>${d.cost_usd != null ? "$" + d.cost_usd.toFixed(3) : "–"}</td>
  </tr>`).join("");
}

load();
setInterval(load, 15000);
</script>
</body>
</html>
