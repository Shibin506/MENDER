[project]
name = "mender"
version = "0.1.0"
description = "A GitHub App that diagnoses failed CI runs on pull requests and suggests a verified fix."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.8",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.8",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
mender = "mender.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mender*"]

[tool.setuptools.package-data]
mender = ["dashboard.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
# Verbatim CI log fixtures
"tests/conftest.py" = ["E501"]
"eval/cases.py" = ["E501"]
"eval/holdout.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
